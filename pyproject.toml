[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pneumonia-cxr"
version = "0.1.0"
description = "Pneumonia vs. normal classification on PneumoniaMNIST chest X-rays: a logistic regression baseline vs. a small PyTorch CNN, with bootstrap confidence intervals."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jathin Mallampati" }]
# Version ranges here keep the package installable; requirements.txt pins the
# exact versions the reported results were produced with.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "torch>=2.1",
    "torchvision>=0.16",
    "medmnist>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pcxr = "pneumonia_cxr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
